<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unbox Love — Admin</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">UNBOX <i>LOVE</i></a><nav><a href="index.html">← View Store</a></nav></header><main style="max-width:900px;margin:auto;padding:70px 6%"><span class="label">STORE MANAGEMENT</span><h1 style="font:600 48px 'Playfair Display'">Admin Panel</h1><p style="color:#796669">Add and manage products for your store.</p><section style="background:#fff;border:1px solid #eadbd7;border-radius:20px;padding:25px;margin:30px 0"><h2 style="font-family:'Playfair Display'">WhatsApp number</h2><p style="font-size:12px;color:#806d70">Use country code + number without + or spaces. Example: 919876543210</p><input id="wa" placeholder="919876543210" style="padding:13px;width:100%;max-width:450px;border:1px solid #d9c9c2;border-radius:10px"><button class="primary" onclick="saveWa()">Save number</button></section><section style="background:#fff;border:1px solid #eadbd7;border-radius:20px;padding:25px"><h2 style="font-family:'Playfair Display'">Add new product</h2><div style="display:grid;gap:10px;max-width:600px"><input id="name" placeholder="Product name" style="padding:13px"><select id="cat" style="padding:13px"><option>Ribbon Bouquet</option><option>Handmade Gifts</option><option>Resin Art</option><option>Gift Hamper</option></select><input id="price" type="number" placeholder="Price ₹" style="padding:13px"><input id="emoji" placeholder="Emoji e.g. 💐 (replace later with product photo)" style="padding:13px"><input id="desc" placeholder="Short description" style="padding:13px"><button class="primary" onclick="addProduct()">Add product</button></div><h2 style="font-family:'Playfair Display';margin-top:40px">Current products</h2><div id="list"></div></section></main><script>
let ps=JSON.parse(localStorage.getItem('ul_products'))||[],w=localStorage.getItem('ul_whatsapp')||'919999999999';document.getElementById('wa').value=w;function saveWa(){localStorage.setItem('ul_whatsapp',document.getElementById('wa').value.replace(/\D/g,''));alert('WhatsApp number saved ❤️')}function addProduct(){let p={id:Date.now(),name:name.value,cat:cat.value,price:Number(price.value),emoji:emoji.value||'🎁',desc:desc.value};if(!p.name||!p.price)return alert('Enter product name and price');ps.push(p);localStorage.setItem('ul_products',JSON.stringify(ps));['name','price','emoji','desc'].forEach(id=>document.getElementById(id).value='');render()}function del(id){ps=ps.filter(p=>p.id!==id);localStorage.setItem('ul_products',JSON.stringify(ps));render()}function render(){list.innerHTML=ps.map(p=>`<div style="padding:13px 0;border-bottom:1px solid #eadbd7;font-size:13px">${p.emoji} <b>${p.name}</b> — ${p.cat} — ₹${p.price}<button style="float:right" onclick="del(${p.id})">Delete</button></div>`).join('')||'<p>No products yet.</p>'}render();
</script></body></html>
